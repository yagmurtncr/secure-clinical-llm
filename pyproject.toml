[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "secure-clinical-llm"
version = "0.1.0"
description = "Privacy-preserving split-inference LLM assistant for Turkish clinical lab reports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nur Yağmur Tuncer" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.46",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "cryptography>=42",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
ner = []
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/scllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
